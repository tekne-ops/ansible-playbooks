[defaults]
# Ansible looks for ansible_collections/<namespace>/<name> under each
# collections_path entry. The sibling checkout provides that with
# ansible_collections/tekne -> ../tekne. Pointing this setting at tekne/devops
# itself does not discover tekne.devops.
collections_path = ../ansible-collections
inventory = inventories/workstation/hosts.yml
retry_files_enabled = False
bin_ansible_callbacks = True
host_key_checking = True
timeout = 30
remote_user = devops

# Output
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks

[inventory]
# Wrong host patterns fail the run. ansible-lint's syntax-check cannot pass
# -i, so that job sets ANSIBLE_HOST_PATTERN_MISMATCH=warning.
host_pattern_mismatch = error
