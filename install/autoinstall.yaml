#cloud-config
autoinstall:
  version: 1

  # No account details were supplied, so collect them during installation.
  interactive-sections:
    - identity

  # Standard (full) Xubuntu installation from the Xubuntu full ISO.
  source:
    id: xubuntu-desktop
    search_drivers: true

  # Install proprietary/third-party drivers and restricted media codecs.
  drivers:
    install: true
  codecs:
    install: true

  storage:
    config:
      # WARNING: both disks are deliberately repartitioned and erased.
      - type: disk
        id: disk-nvme0n1
        path: /dev/nvme0n1
        ptable: gpt
        wipe: superblock-recursive
        preserve: false

      - type: partition
        id: partition-boot
        device: disk-nvme0n1
        number: 1
        size: 1%
        partition_name: BOOT
        flag: boot
        grub_device: true
        wipe: superblock
        preserve: false

      - type: partition
        id: partition-root
        device: disk-nvme0n1
        number: 2
        size: -1
        partition_name: ROOT
        wipe: superblock
        preserve: false

      - type: disk
        id: disk-nvme1n1
        path: /dev/nvme1n1
        ptable: gpt
        wipe: superblock-recursive
        preserve: false

      - type: partition
        id: partition-data
        device: disk-nvme1n1
        number: 1
        size: 100%
        partition_name: DATA
        wipe: superblock
        preserve: false

      - type: format
        id: format-boot
        volume: partition-boot
        fstype: fat32
        label: BOOT
        preserve: false

      - type: format
        id: format-root
        volume: partition-root
        fstype: ext4
        label: ROOT
        preserve: false

      - type: format
        id: format-data
        volume: partition-data
        fstype: ext4
        label: DATA
        preserve: false

      - type: mount
        id: mount-root
        device: format-root
        path: /

      - type: mount
        id: mount-boot
        device: format-boot
        path: /boot/efi
