---
# Compatibility dispatcher. ASTER, YUGEN, and KVM run workstation roles.
# THEMIS runs server roles. Hostname checks are tagged always.
#
#   ansible-playbook playbooks/main.yml --ask-vault-pass
#   ansible-playbook playbooks/main.yml --vault-password-file=~/.vault_pass
#   ansible-playbook playbooks/main.yml --tags kde

- name: Dispatch host configuration
  hosts: localhost
  connection: local
  become: true

  vars:
    tekne_allowed_hostnames:
      - ASTER
      - YUGEN
      - KVM
      - THEMIS

  pre_tasks:
    - name: Assert the host profile
      ansible.builtin.import_tasks: tasks/hostname.yml

    - name: Load encrypted vault variables
      ansible.builtin.import_tasks: tasks/load_vault.yml

  tasks:
    - name: Apply workstation roles
      ansible.builtin.import_tasks: tasks/workstation_roles.yml
      when: current_hostname != 'THEMIS'

    - name: Apply server roles
      ansible.builtin.import_tasks: tasks/server_roles.yml
      when: current_hostname == 'THEMIS'
