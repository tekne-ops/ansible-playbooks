---
# Workstation entrypoint for ASTER, YUGEN, and KVM.
#
#   ansible-playbook playbooks/workstation.yml -i inventories/workstation/hosts.yml --ask-vault-pass
#   ansible-playbook playbooks/workstation.yml -i inventories/workstation/hosts.yml --tags kde

- name: Configure workstation
  hosts: workstations
  connection: local
  become: true

  vars:
    tekne_allowed_hostnames:
      - ASTER
      - YUGEN
      - KVM

  pre_tasks:
    - name: Assert the workstation host profile
      ansible.builtin.import_tasks: tasks/hostname.yml

    - name: Load encrypted vault variables
      ansible.builtin.import_tasks: tasks/load_vault.yml

  tasks:
    - name: Apply workstation roles
      ansible.builtin.import_tasks: tasks/workstation_roles.yml
