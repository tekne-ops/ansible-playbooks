---
name: Ansible Lint

"on":
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install -r requirements.yml -p "${RUNNER_TEMP}/collections"

      - name: Check install profiles and autoinstall renderer
        run: |
          python3 install/tests/test_profiles.py
          python3 install/tests/test_render_autoinstall.py

      - name: Syntax-check entrypoints
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: |
          ansible-playbook playbooks/workstation.yml --syntax-check
          ansible-playbook playbooks/server.yml -i inventories/server/hosts.yml --syntax-check
          ansible-playbook playbooks/main.yml --syntax-check
          ansible-playbook playbooks/k8s.yml -i inventories/k8s/hosts.yml --syntax-check

      - name: Lint entrypoints
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
          # ansible-lint syntax-check cannot pass -i. Keep real runs fatal
          # via ansible.cfg, and let this embedded check warn when the
          # default workstation inventory has no k8s_cluster or servers group.
          ANSIBLE_HOST_PATTERN_MISMATCH: warning
        run: |
          ansible-lint playbooks/workstation.yml playbooks/server.yml playbooks/main.yml playbooks/k8s.yml
